[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "injector"
version = "0.1.0"
description = "A controlled prompt-injection security test harness for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["typer>=0.12,<1", "httpx>=0.27,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
injector = "injector.cli:app"

[tool.setuptools.packages.find]
include = ["injector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.setuptools.package-data]
injector = ["cases/*.yaml"]
