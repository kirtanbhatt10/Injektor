[build-system]
requires = ["setuptools>=69,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "injektor"
version = "0.1.0"
description = "A controlled prompt-injection security test harness for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Typer 0.12.0 to 0.15.3 accept any Click but break with Click 8.2 and later ("Missing
# command" for every invocation). 0.15.4 is the first release that pins a Click it works with.
dependencies = ["typer>=0.15.4,<1", "httpx>=0.27,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "packaging>=23"]

[project.scripts]
injektor = "injektor.cli:app"

[tool.setuptools.packages.find]
include = ["injektor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned so that results do not change with the default rule set of the installed Ruff version.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
injektor = ["cases/*.yaml"]
