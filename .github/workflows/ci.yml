name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
  # The lowest dependency versions the package declares. Typer below 0.15.4 resolves to a
  # Click it cannot work with ("Missing command" for every invocation); tests/test_packaging.py
  # pins the declared floor and this job runs the whole suite on it.
  min-deps:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "typer==0.15.4" "httpx==0.27.0"
      - run: python -m pip list
      - run: pytest
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      # Install the built wheel, not the checkout, so missing package data is caught.
      - run: python -m venv /tmp/fresh && /tmp/fresh/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/fresh/bin/injektor --version && /tmp/fresh/bin/injektor list
