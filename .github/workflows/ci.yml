name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          # Typer forces colored Rich output when it detects GitHub Actions;
          # ANSI codes would break assertions on CLI output.
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          NO_COLOR: "1"
