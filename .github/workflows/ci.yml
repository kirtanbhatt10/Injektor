name: quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          NO_COLOR: "1"

  min-deps:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "typer==0.15.4" "httpx==0.27.0"
      - run: python -m pip list
      - run: pytest
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          NO_COLOR: "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/fresh && /tmp/fresh/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/fresh/bin/injektor --version && /tmp/fresh/bin/injektor list