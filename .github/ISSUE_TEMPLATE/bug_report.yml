name: Bug report
description: Something in Injektor does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Do not paste API keys, real canaries, report excerpts or other secrets.** For security vulnerabilities, follow the [security policy](https://github.com/kirtanbhatt10/Injektor/security/policy) instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran. If possible, reproduce with `injektor demo` so no real endpoint is involved.
      placeholder: |
        1. injektor demo --mode vulnerable
        2. injektor scan --output reports/test
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant console output, with the exit status if it matters. Redact endpoints and secrets.
      render: text
  - type: input
    id: version
    attributes:
      label: Injektor version
      description: Output of `injektor --version`.
      placeholder: injektor 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
